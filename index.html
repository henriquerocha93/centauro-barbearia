<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agendamento Fácil BR | Gestão Inteligente v80.00 (Versão Final)</title>

    <link rel="stylesheet" href="styles.css?v=104">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" id="app-manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        // Blindagem Imediata de Tenant e Manifest PWA
        (function() {
            try {
                var params = new URLSearchParams(window.location.search);
                var loja = params.get('loja');
                if (!loja) {
                    var parts = window.location.pathname.split('/').filter(function(p) { return p && p !== 'index.html'; });
                    var ignore = ['master', 'AgendamentoFacil', 'assets', 'sw.js', 'robots.txt', 'api'];
                    loja = parts.find(function(p) { return !ignore.includes(p); });
                }
                if (!loja) {
                    loja = localStorage.getItem('active_tenant_id');
                }
                if (loja && loja !== 'totem') {
                    localStorage.setItem('active_tenant_id', loja);
                    var link = document.getElementById('app-manifest');
                    if (link) {
                        link.href = '/api/manifest?loja=' + encodeURIComponent(loja);
                    }
                }
            } catch(e) {}
        })();
    </script>
    <script src="app_v15.js?v=80.37" type="module"></script>
    <script src="assinaturas_module.js?v=80.37"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("ERRO: " + message + " Linha: " + lineno);
        };
        window.addEventListener('load', () => {
            console.log('Sistema Centauro v80.00 (Versão Final) Carregado');
            
            // Registra Service Worker para Push Notifications (sem cache offline)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(function(registration) {
                        console.log('[Push] Service Worker registrado:', registration.scope);
                        window._swRegistration = registration;
                    })
                    .catch(function(error) {
                        console.warn('[Push] Falha ao registrar Service Worker:', error);
                    });
            }
        });
    </script>
</head>
<body>
    <div id="app" class="container">
        <!-- Renderização Dinâmica total via JS para o visual Vintage -->
    </div>

    <dialog id="app-modal" class="glass" style="padding: 0; border: 1px solid var(--glass-border); border-radius: 15px; color: var(--text-primary); max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto;">
        <!-- Conteúdo injetado via JS -->
    </dialog>

    <style>
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
        dialog section {
            padding: 25px;
        }
    </style>
</body>
</html>
