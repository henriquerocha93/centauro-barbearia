<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agendamento Fácil BR | Gestão Inteligente v80.00 (Versão Final)</title>

    <link rel="stylesheet" href="styles.css?v=106">
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#050505">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="icon" type="image/png" href="favicon.png">
    <script>
        // Blindagem Imediata de Tenant e Manifest PWA
        (function() {
            try {
                // Remove qualquer resquício de cookie que possa interferir no roteamento da raiz
                document.cookie = 'active_tenant_id=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; max-age=0';
            } catch(e) {}

            try {
                var params = new URLSearchParams(window.location.search);
                var loja = params.get('loja');
                if (!loja) {
                    var parts = window.location.pathname.split('/').filter(function(p) { return p && p !== 'index.html'; });
                    var ignore = ['master', 'AgendamentoFacil', 'assets', 'sw.js', 'robots.txt', 'api'];
                    loja = parts.find(function(p) { return !ignore.includes(p); });
                }

                var isPWA = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true || params.get('pwa') === '1';

                // Se não há loja na URL:
                // Em navegador comum na raiz, SEMPRE redireciona para a página de vendas
                if (!loja) {
                    if (!isPWA) {
                        window.location.replace('/AgendamentoFacil/index.html');
                        return;
                    }
                    loja = localStorage.getItem('active_tenant_id');
                    if (!loja) {
                        window.location.replace('/AgendamentoFacil/index.html');
                        return;
                    }
                }

                if (loja && loja !== 'totem') {
                    localStorage.setItem('active_tenant_id', loja);
                }
                
                var shopName = (loja && loja !== 'centauro' && loja !== 'totem')
                    ? loja.replace(/-/g, ' ').replace(/\b\w/g, function(l) { return l.toUpperCase(); })
                    : 'Centauro Barbearia';
                
                if (loja && loja !== 'centauro' && loja !== 'totem') {
                    document.title = shopName + ' | Sistema de Gestão';
                }

                // Injetar manifest dinâmico da loja ANTES de qualquer requisição do navegador
                var manifestUrl = (loja && loja !== 'totem')
                    ? '/api/manifest?loja=' + encodeURIComponent(loja) + '&name=' + encodeURIComponent(shopName)
                    : '/api/manifest?loja=centauro&name=Centauro+Barbearia';
                
                var link = document.createElement('link');
                link.rel = 'manifest';
                link.id = 'app-manifest';
                link.href = manifestUrl;
                document.head.appendChild(link);

                // Configurar título do app no iOS Safari (apple-mobile-web-app-title)
                var appleTitleMeta = document.createElement('meta');
                appleTitleMeta.name = 'apple-mobile-web-app-title';
                appleTitleMeta.content = shopName;
                document.head.appendChild(appleTitleMeta);
            } catch(e) {
                var fbLink = document.createElement('link');
                fbLink.rel = 'manifest';
                fbLink.id = 'app-manifest';
                fbLink.href = '/api/manifest?loja=centauro';
                document.head.appendChild(fbLink);
            }
        })();
    </script>
    <script src="app_v15.js?v=80.41" type="module"></script>
    <script src="assinaturas_module.js?v=80.41"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script>
        window.onerror = function(message, source, lineno, colno, error) {
            alert("ERRO: " + message + " Linha: " + lineno);
        };
        window.addEventListener('load', () => {
            console.log('Sistema Centauro v80.00 (Versão Final) Carregado');
            
            // Registra Service Worker para Push Notifications (sem cache offline)
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('/sw.js', { scope: '/' })
                    .then(function(registration) {
                        console.log('[Push] Service Worker registrado:', registration.scope);
                        window._swRegistration = registration;
                    })
                    .catch(function(error) {
                        console.warn('[Push] Falha ao registrar Service Worker:', error);
                    });
            }
        });
    </script>
</head>
<body>
    <div id="app" class="container">
        <!-- Renderização Dinâmica total via JS para o visual Vintage -->
    </div>

    <dialog id="app-modal" class="glass" style="padding: 0; border: 1px solid var(--glass-border); border-radius: 15px; color: var(--text-primary); max-width: 400px; width: 90%; max-height: 90vh; overflow-y: auto;">
        <!-- Conteúdo injetado via JS -->
    </dialog>

    <style>
        dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }
        dialog section {
            padding: 25px;
        }
    </style>
</body>
</html>
